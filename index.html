<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusChat - Offline Room Messaging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth custom scrollbar for app-like feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.6);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-[100dvh] flex flex-col justify-between select-none sm:select-auto overflow-hidden">

    <!-- App Header -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 p-4 shadow-lg flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/20 font-black text-white text-lg tracking-wider">
                💬
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">NexusChat</h1>
                <p class="text-[10px] text-gray-400 font-medium tracking-wide uppercase">Offline Secure Rooms</p>
            </div>
        </div>

        <div id="room-info" class="hidden flex items-center gap-2 sm:gap-3">
            <div class="text-xs bg-gray-800/90 border border-gray-700/60 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-gray-400 hidden sm:inline">Room:</span> 
                <span id="display-code" class="font-mono font-bold text-indigo-300 tracking-wider"></span>
                <!-- Copy Code Button -->
                <button id="copy-code-btn" class="p-1 hover:bg-gray-700 rounded-full transition text-gray-300 hover:text-white active:scale-95" title="Copy Room Code">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
            </div>
            <button id="leave-btn" class="text-xs bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-xl font-medium transition active:scale-95">Leave</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 overflow-hidden flex flex-col items-center justify-center p-3 sm:p-6">
        
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="w-full max-w-md bg-gray-900/90 backdrop-blur-xl p-6 sm:p-8 rounded-2xl shadow-2xl border border-gray-800 space-y-6 animate-fadeIn">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-bold text-white tracking-tight">Welcome to NexusChat</h2>
                <p class="text-xs text-gray-400">Create or join a private offline message room</p>
            </div>
            
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">Your Display Name</label>
                <input type="text" id="username-input" placeholder="e.g. Alex" maxlength="20" class="w-full px-4 py-3 bg-gray-950/60 border border-gray-700/70 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-gray-500 text-sm transition">
            </div>

            <div class="space-y-3 pt-2">
                <button id="create-btn" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl transition duration-200 shadow-lg shadow-indigo-600/25 active:scale-[0.98] text-sm flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                    Create New Room
                </button>
                
                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-800"></div>
                    <span class="flex-shrink mx-4 text-gray-500 text-xs font-medium uppercase">or join existing</span>
                    <div class="flex-grow border-t border-gray-800"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="ROOM CODE" class="flex-1 px-4 py-3 bg-gray-950/60 border border-gray-700/70 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 uppercase text-white font-mono placeholder-gray-600 text-sm tracking-widest transition">
                    <button id="join-btn" class="px-5 py-3 bg-gray-800 hover:bg-gray-700 text-indigo-300 hover:text-white border border-gray-700 font-semibold rounded-xl transition duration-200 active:scale-[0.98] text-sm">
                        Join
                    </button>
                </div>
            </div>

            <p id="error-msg" class="text-rose-400 text-xs text-center font-medium hidden bg-rose-500/10 border border-rose-500/20 py-2 rounded-lg"></p>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="w-full max-w-2xl h-full flex flex-col bg-gray-900/60 backdrop-blur-md rounded-2xl shadow-xl border border-gray-800/80 hidden overflow-hidden">
            <!-- Messages List -->
            <div id="messages-container" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
                <!-- Messages dynamically loaded here -->
            </div>

            <!-- Message Input Form -->
            <form id="chat-form" class="p-3 bg-gray-900/90 border-t border-gray-800 flex gap-2 items-center">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" class="flex-1 px-4 py-3 bg-gray-950/80 border border-gray-700/70 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-gray-500 text-sm transition">
                <button type="submit" class="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition duration-200 shadow-md shadow-indigo-600/20 active:scale-95 text-sm flex items-center justify-center">
                    <svg class="w-4 h-4 rotate-90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"></path></svg>
                </button>
            </form>
        </div>

    </main>

    <!-- Client-side Logic & Auto-Update Engine -->
    <script>
        const STORAGE_KEY = 'pulsechat_rooms_data_v2';
        const USER_KEY = 'pulsechat_username';

        const welcomeScreen = document.getElementById('welcome-screen');
        const chatScreen = document.getElementById('chat-screen');
        const roomInfo = document.getElementById('room-info');
        const displayCode = document.getElementById('display-code');
        const leaveBtn = document.getElementById('leave-btn');
        const copyCodeBtn = document.getElementById('copy-code-btn');
        
        const usernameInput = document.getElementById('username-input');
        const createBtn = document.getElementById('create-btn');
        const roomCodeInput = document.getElementById('room-code-input');
        const joinBtn = document.getElementById('join-btn');
        const errorMsg = document.getElementById('error-msg');

        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        let currentUsername = '';
        let currentRoomCode = '';

        // Load saved username if present
        const savedName = localStorage.getItem(USER_KEY);
        if (savedName) usernameInput.value = savedName;

        function loadRoomsData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {};
        }

        function saveRoomsData(rooms) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms));
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
        }

        function getUsername() {
            const name = usernameInput.value.trim();
            if (!name) {
                showError('Please enter your display name first!');
                usernameInput.focus();
                return null;
            }
            errorMsg.classList.add('hidden');
            localStorage.setItem(USER_KEY, name);
            return name;
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Clean alphabet avoiding lookalikes (0/O, 1/I)
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Copy Room Code to Clipboard
        copyCodeBtn.addEventListener('click', () => {
            if (!currentRoomCode) return;
            navigator.clipboard.writeText(currentRoomCode).then(() => {
                const originalHTML = copyCodeBtn.innerHTML;
                copyCodeBtn.innerHTML = `<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                setTimeout(() => {
                    copyCodeBtn.innerHTML = originalHTML;
                }, 1500);
            });
        });

        // Create Room Button
        createBtn.addEventListener('click', () => {
            const name = getUsername();
            if (!name) return;
            currentUsername = name;

            const rooms = loadRoomsData();
            let code;
            do {
                code = generateRoomCode();
            } while (rooms[code]);

            rooms[code] = {
                createdAt: new Date().toISOString(),
                messages: []
            };
            saveRoomsData(rooms);
            joinRoomCode(code);
        });

        // Join Room Button
        joinBtn.addEventListener('click', () => {
            const name = getUsername();
            if (!name) return;
            currentUsername = name;

            const code = roomCodeInput.value.trim().toUpperCase();
            if (!code) {
                showError('Please enter a room code!');
                roomCodeInput.focus();
                return;
            }

            const rooms = loadRoomsData();
            if (!rooms[code]) {
                showError('Room does not exist or has expired!');
                return;
            }

            joinRoomCode(code);
        });

        // Also allow pressing Enter in inputs
        roomCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') roomCodeInput.focus();
        });

        function joinRoomCode(code) {
            currentRoomCode = code;
            welcomeScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            roomInfo.classList.remove('hidden');
            displayCode.textContent = code;

            renderMessages();
            appendNotification('You connected to the room.');
            messageInput.focus();
        }

        // Leave Room
        leaveBtn.addEventListener('click', () => {
            currentRoomCode = '';
            chatScreen.classList.add('hidden');
            roomInfo.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            messagesContainer.innerHTML = '';
            errorMsg.classList.add('hidden');
        });

        // Send Message
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentRoomCode) return;

            const rooms = loadRoomsData();
            if (!rooms[currentRoomCode]) return;

            const messageData = {
                sender: currentUsername,
                text: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            rooms[currentRoomCode].messages.push(messageData);
            saveRoomsData(rooms);

            messageInput.value = '';
            renderMessages();
        });

        // Render messages from storage
        function renderMessages() {
            if (!currentRoomCode) return;
            const rooms = loadRoomsData();
            const room = rooms[currentRoomCode];
            if (!room) return;

            messagesContainer.innerHTML = '';
            room.messages.forEach(msg => {
                const isSelf = msg.sender === currentUsername;
                const initial = msg.sender.charAt(0).toUpperCase();
                const div = document.createElement('div');
                div.className = `flex gap-2.5 ${isSelf ? 'justify-end' : 'justify-start'} items-end`;
                
                if (!isSelf) {
                    div.innerHTML = `
                        <div class="w-7 h-7 rounded-full bg-gray-700 text-gray-200 flex items-center justify-center font-bold text-xs shrink-0 shadow">${initial}</div>
                        <div class="flex flex-col space-y-1 max-w-[75%] sm:max-w-md">
                            <span class="text-[11px] text-gray-400 font-medium ml-1">${escapeHtml(msg.sender)}</span>
                            <div class="px-4 py-2.5 rounded-2xl rounded-bl-sm bg-gray-800 text-gray-100 text-sm shadow-sm break-words border border-gray-700/50">
                                ${escapeHtml(msg.text)}
                                <div class="text-[9px] text-gray-400 text-right mt-1">${msg.timestamp}</div>
                            </div>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="flex flex-col space-y-1 max-w-[75%] sm:max-w-md">
                            <div class="px-4 py-2.5 rounded-2xl rounded-br-sm bg-indigo-600 text-white text-sm shadow-md break-words">
                                ${escapeHtml(msg.text)}
                                <div class="text-[9px] text-indigo-200 text-right mt-1">${msg.timestamp}</div>
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow">${initial}</div>
                    `;
                }
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendNotification(text) {
            const div = document.createElement('div');
            div.className = 'text-center my-3';
            div.innerHTML = `<span class="text-[11px] bg-gray-800/80 border border-gray-700/60 text-gray-400 px-3 py-1 rounded-full shadow-sm">${escapeHtml(text)}</span>`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Multi-tab real-time sync across browser windows
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY && currentRoomCode) {
                renderMessages();
            }
        });

        // -------------------------------------------------------------
        // AUTOMATIC DEVELOPER UPDATE SYSTEM
        // Checks the hosting server every 30 seconds. If the developer
        // updates the file, it automatically refreshes for all users.
        // -------------------------------------------------------------
        let initialServerModifiedTime = null;
        async function checkDeveloperUpdates() {
            try {
                const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
                const lastModified = response.headers.get('Last-Modified');
                if (!initialServerModifiedTime && lastModified) {
                    initialServerModifiedTime = lastModified;
                } else if (initialServerModifiedTime && lastModified && lastModified !== initialServerModifiedTime) {
                    // Developer has updated the file on the server! Auto reload silently.
                    window.location.reload(true);
                }
            } catch (err) {
                // Ignore network errors when offline
            }
        }
        setInterval(checkDeveloperUpdates, 30000);
    </script>
</body>
</html>
